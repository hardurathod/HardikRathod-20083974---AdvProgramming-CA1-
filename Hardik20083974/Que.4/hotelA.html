<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Aurora - Luxury Rooms & Suites</title>
    <meta name="description" content="Experience luxury redefined at Hotel Aurora. Discover our exquisite collection of rooms and suites.">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #0d2137 50%, #061220 100%);
            min-height: 100vh;
            color: #f5f3ef;
            overflow-x: hidden;
        }

    
        .bg-particles {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.8), transparent);
            border-radius: 50%;
            animation: float-particle 15s infinite ease-in-out;
        }

        @keyframes float-particle {
            0%, 100% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

     
        header {
            text-align: center;
            padding: 80px 20px 60px;
            position: relative;
            z-index: 10;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 50px;
            padding: 12px 24px;
            margin-bottom: 30px;
            animation: fadeInDown 1s ease-out;
        }

        .badge::before {
            content: '✦';
            color: #d4af37;
            animation: sparkle 2s infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .badge span {
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.8);
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3rem, 10vw, 7rem);
            font-weight: 600;
            margin-bottom: 20px;
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        h1 .gold {
            background: linear-gradient(135deg, #d4af37 0%, #f4e4a6 50%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.6);
            max-width: 600px;
            margin: 0 auto 40px;
            font-weight: 300;
            letter-spacing: 1px;
            animation: fadeInUp 1s ease-out 0.4s both;
        }

       
        .decorative-line {
            width: 150px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin: 0 auto;
            animation: expandLine 1.5s ease-out 0.6s both;
        }

        @keyframes expandLine {
            from { width: 0; opacity: 0; }
            to { width: 150px; opacity: 1; }
        }

     
        .section-header {
            text-align: center;
            padding: 40px 20px;
        }

        .section-header h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px 80px;
            position: relative;
            z-index: 10;
        }

        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

     
        .room-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            transform: translateY(40px);
            animation: cardReveal 0.8s ease-out forwards;
        }

        .room-card:nth-child(1) { animation-delay: 0.1s; }
        .room-card:nth-child(2) { animation-delay: 0.2s; }
        .room-card:nth-child(3) { animation-delay: 0.3s; }
        .room-card:nth-child(4) { animation-delay: 0.4s; }
        .room-card:nth-child(5) { animation-delay: 0.5s; }
        .room-card:nth-child(6) { animation-delay: 0.6s; }
        .room-card:nth-child(7) { animation-delay: 0.7s; }
        .room-card:nth-child(8) { animation-delay: 0.8s; }

        @keyframes cardReveal {
            to { opacity: 1; transform: translateY(0); }
        }

        .room-card:hover {
            transform: translateY(-15px) scale(1.02);
            border-color: rgba(212, 175, 55, 0.4);
            box-shadow: 
                0 30px 60px rgba(0,0,0,0.4),
                0 0 40px rgba(212, 175, 55, 0.15);
        }

        .room-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.1), transparent);
            transition: left 0.7s;
            z-index: 1;
        }

        .room-card:hover::before {
            left: 100%;
        }

       
        .image-container {
            position: relative;
            height: 220px;
            overflow: hidden;
        }

        .room-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .room-card:hover .room-image {
            transform: scale(1.15);
        }

        .image-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(10, 22, 40, 0.9) 0%, transparent 60%);
            pointer-events: none;
        }

       
        .price-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(10, 22, 40, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 50px;
            padding: 10px 18px;
            z-index: 2;
        }

        .price-badge .price {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #d4af37, #f4e4a6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .price-badge .per-night {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.5);
        }

        
        .room-info {
            padding: 25px;
            position: relative;
        }

        .room-info h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 12px;
            transition: all 0.3s;
        }

        .room-card:hover .room-info h3 {
            background: linear-gradient(135deg, #d4af37, #f4e4a6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

       
        .rating {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .stars {
            display: flex;
            gap: 3px;
        }

        .star {
            color: #d4af37;
            font-size: 14px;
            transition: transform 0.3s;
        }

        .star.empty {
            color: rgba(255,255,255,0.2);
        }

        .room-card:hover .star:not(.empty) {
            animation: starPulse 0.5s ease-out;
        }

        .room-card:hover .star:nth-child(1) { animation-delay: 0s; }
        .room-card:hover .star:nth-child(2) { animation-delay: 0.1s; }
        .room-card:hover .star:nth-child(3) { animation-delay: 0.2s; }
        .room-card:hover .star:nth-child(4) { animation-delay: 0.3s; }
        .room-card:hover .star:nth-child(5) { animation-delay: 0.4s; }

        @keyframes starPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .rating-text {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
        }

       
        .amenities {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .amenity {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.7);
            transition: all 0.3s;
        }

        .amenity:hover {
            background: rgba(212, 175, 55, 0.15);
            border-color: rgba(212, 175, 55, 0.4);
            color: #d4af37;
        }

        
        .book-btn {
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(212, 175, 55, 0.05));
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 14px;
            color: #d4af37;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .book-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #d4af37, #f4e4a6);
            opacity: 0;
            transition: opacity 0.4s;
            z-index: -1;
        }

        .book-btn:hover {
            color: #0a1628;
            border-color: #d4af37;
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
        }

        .book-btn:hover::before {
            opacity: 1;
        }

        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        
        footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            color: rgba(255,255,255,0.4);
            font-size: 0.85rem;
        }

        
        @media (max-width: 768px) {
            .rooms-grid {
                grid-template-columns: 1fr;
            }
            
            header {
                padding: 60px 20px 40px;
            }
        }
    </style>
</head>
<body>
    
    <div class="bg-particles" id="particles"></div>

   
    <header>
        <div class="badge">
            <span>Exclusive Collection</span>
        </div>
        <h1>Hotel <span class="gold">Aurora</span></h1>
        <p class="subtitle">Experience luxury redefined. Discover our exquisite collection of rooms and suites.</p>
        <div class="decorative-line"></div>
    </header>

    
    <div class="section-header">
        <h2>Our Rooms</h2>
        <div class="decorative-line"></div>
    </div>

    
    <div class="container">
        <div class="rooms-grid" id="roomsGrid"></div>
    </div>

    
    <footer>
        <p>© 2024 Hotel Aurora. All rights reserved.</p>
    </footer>

    <script>
        
        const rooms = [
            { name: 'Deluxe Room', price: 120, rating: 4, amenities: ['WiFi', 'TV', 'Mini Bar', 'Balcony'], image: 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=640&q=80' },
            { name: 'Standard Room', price: 80, rating: 3, amenities: ['WiFi', 'TV', 'Air Conditioning'], image: 'https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?w=640&q=80' },
            { name: 'Suite Room', price: 200, rating: 5, amenities: ['WiFi', 'TV', 'Mini Bar', 'Balcony', 'Jacuzzi'], image: 'https://images.unsplash.com/photo-1611892440504-42a792e24d32?w=640&q=80' },
            { name: 'Single Room', price: 60, rating: 3, amenities: ['WiFi', 'TV'], image: 'https://images.unsplash.com/photo-1551882547-ff7a0f8d1f99?w=640&q=80' },
            { name: 'Double Room', price: 100, rating: 4, amenities: ['WiFi', 'TV', 'Mini Bar'], image: 'https://images.unsplash.com/photo-1590490360182-c33d57733427?w=640&q=80' },
            { name: 'Family Room', price: 180, rating: 4, amenities: ['WiFi', 'TV', 'Mini Bar', 'Balcony'], image: 'https://images.unsplash.com/photo-1596394516093-501ba68a0ba6?w=640&q=80' },
            { name: 'Presidential Suite', price: 350, rating: 5, amenities: ['WiFi', 'TV', 'Mini Bar', 'Balcony', 'Jacuzzi', 'Kitchen'], image: 'https://images.unsplash.com/photo-1631049307264-da0ec9d70304?w=640&q=80' },
            { name: 'Economy Room', price: 50, rating: 3, amenities: ['WiFi', 'TV'], image: 'https://images.unsplash.com/photo-1631049552057-403cdb8f0658?w=640&q=80' }
        ];

        
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (15 + Math.random() * 10) + 's';
                container.appendChild(particle);
            }
        }

        
        function createStars(rating) {
            let html = '';
            for (let i = 1; i <= 5; i++) {
                html += `<span class="star ${i <= rating ? '' : 'empty'}">★</span>`;
            }
            return html;
        }

        
        function createRoomCards() {
            const grid = document.getElementById('roomsGrid');
            rooms.forEach(room => {
                const card = document.createElement('div');
                card.className = 'room-card';
                card.innerHTML = `
                    <div class="image-container">
                        <img class="room-image" src="${room.image}" alt="${room.name}">
                        <div class="image-overlay"></div>
                        <div class="price-badge">
                            <span class="price">$${room.price}</span>
                            <span class="per-night">/night</span>
                        </div>
                    </div>
                    <div class="room-info">
                        <h3>${room.name}</h3>
                        <div class="rating">
                            <div class="stars">${createStars(room.rating)}</div>
                            <span class="rating-text">(${room.rating}.0)</span>
                        </div>
                        <div class="amenities">
                            ${room.amenities.map(a => `<span class="amenity">${a}</span>`).join('')}
                        </div>
                        <button class="book-btn">Book Now</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

       
        createParticles();
        createRoomCards();
    </script>
</body>
</html>
